<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MATCHAHOLIC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<script>
const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");

const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");

const togglePassword = document.getElementById("togglePassword");
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");


// SHOW / HIDE PASSWORD
togglePassword.addEventListener("click", function () {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "Hide";
    } else {
        passwordInput.type = "password";
        togglePassword.textContent = "Show";
    }
});


// SHOW / HIDE CONFIRM PASSWORD
toggleConfirmPassword.addEventListener("click", function () {
    if (confirmPasswordInput.type === "password") {
        confirmPasswordInput.type = "text";
        toggleConfirmPassword.textContent = "Hide";
    } else {
        confirmPasswordInput.type = "password";
        toggleConfirmPassword.textContent = "Show";
    }
});


// REGISTER
registerForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // PASSWORD CHECK
    if (password !== confirmPassword) {
        registerMessage.textContent = "Passwords do not match.";
        return;
    }

    // PASSWORD LENGTH
    if (password.length < 6) {
        registerMessage.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    registerMessage.textContent = "Creating your account...";

    try {

        const response = await fetch("/api/auth/register", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            registerMessage.textContent =
                data.message ||
                data.error ||
                "Registration failed.";

            return;
        }

        registerMessage.textContent =
            "Account created successfully!";

        setTimeout(function () {
            window.location.href = "login.html";
        }, 1000);

    } catch (error) {

        console.error(error);

        registerMessage.textContent =
            "Unable to connect to the server.";
    }

});
</script>








<body>

    <main class="register-page">

        <!-- LEFT SIDE -->
        <section class="register-visual">

            <div class="brand">
                <span class="brand-mark">M</span>
                <span class="brand-name">MATCHAHOLIC</span>
            </div>

            <div class="visual-content">

                <p class="small-text">JOIN THE COMMUNITY</p>

                <h1>
                    Find your<br>
                    perfect <span>matcha.</span>
                </h1>

                <p class="visual-description">
                    Create your MATCHAHOLIC account and discover
                    a world of matcha made just for you.
                </p>

            </div>

            <div class="leaf-decoration leaf-one">☘</div>
            <div class="leaf-decoration leaf-two">✦</div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="register-container">

            <div class="register-card">

                <div class="mobile-brand">

                    <span class="brand-mark">M</span>

                    <span class="brand-name">
                        MATCHAHOLIC
                    </span>

                </div>


                <div class="heading">

                    <p class="eyebrow">
                        GET STARTED
                    </p>

                    <h2>
                        Create an account
                    </h2>

                    <p>
                        Join MATCHAHOLIC and start your matcha journey.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- USERNAME -->
                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                                minlength="6"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="toggle-password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- REGISTER BUTTON -->
                    <button
                        type="submit"
                        class="register-btn"
                    >
                        CREATE ACCOUNT
                    </button>


                    <p
                        id="registerMessage"
                        class="register-message"
                    ></p>

                </form>


                <div class="divider">
                    <span>or</span>
                </div>


                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>

        </section>

    </main>



</body>
</html>
