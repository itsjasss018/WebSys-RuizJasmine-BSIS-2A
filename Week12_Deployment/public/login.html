<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MATCHAHOLIC</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js"></script>
   
</head>

<body>

    <main class="login-page">

        <!-- Left Decorative Section -->
        <section class="login-visual">

            <div class="brand">
                <span class="brand-mark">M</span>
                <span class="brand-name">MATCHAHOLIC</span>
            </div>

            <div class="visual-content">
                <p class="small-text">WELCOME BACK</p>

                <h1>
                    Your daily dose<br>
                    of <span>matcha.</span>
                </h1>

                <p class="visual-description">
                    Discover your favorites, explore new blends,
                    and make every sip a little more special.
                </p>
            </div>

            <div class="leaf-decoration leaf-one">☘</div>
            <div class="leaf-decoration leaf-two">✦</div>

        </section>


        <!-- Login Form Section -->
        <section class="login-container">

            <div class="login-card">

                <div class="mobile-brand">
                    <span class="brand-mark">M</span>
                    <span class="brand-name">MATCHAHOLIC</span>
                </div>

                <div class="heading">
                    <p class="eyebrow">WELCOME BACK</p>

                    <h2>Log in</h2>

                    <p>
                        Sign in to continue your matcha journey.
                    </p>
                </div>


                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <div class="form-group">
                        <div class="password-label">
                            <label for="password">Password</label>

                            <a href="#" class="forgot-password">
                                Forgot password?
                            </a>
                        </div>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>
                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        LOG IN
                    </button>


                    <!-- Message -->
                    <p id="loginMessage" class="login-message"></p>

                </form>


                <div class="divider">
                    <span>or</span>
                </div>


                <p class="register-text">
                        Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
